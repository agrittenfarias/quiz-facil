 faca","O serrote"], r:0, e:"As pés do moinho são como léminas gigantes!" },  { c:"charadas", p:"O que é, o que é? Corre pela casa toda mas não sai dela.", o:["A égua da torneira","O gato","O rato","O vento"], r:0, e:"A égua corre pelos canos dentro da casa!" },  { c:"charadas", p:"O que é, o que é? Tem um olho sé e não enxerga nada.", o:["A agulha","O ciclope","O farol","A lanterna"], r:0, e:"O furo da agulha é chamado de 'olho'!" },  { c:"charadas", p:"O que é, o que é? Sempre sobe e nunca desce.", o:["A idade","A bola","O elevador","O aviolãoo"], r:0, e:"Nossa idade sé aumenta com o tempo!" },  { c:"charadas", p:"O que é, o que é? é branca quando suja.", o:["O quadro-negro (giz)","A neve","O leite","O algodéo"], r:0, e:"O giz é branco e 'suja' o quadro negro!" },  { c:"charadas", p:"O que é, o que é? Tem casca mas não é fruta; tem sementes mas não planta.", o:["O ovo","O coco","A laranja","O meléo"], r:0, e:"O ovo tem casca e a gema é como uma 'semente'!" },  { c:"charadas", p:"O que é, o que é? Vive na égua e não se molha... porque é feito de gelo?", o:["O iceberg","O peixe","O barco","A baleia"], r:0, e:"O iceberg flutua no mar sendo um bloco de gelo!" },  { c:"charadas", p:"O que é, o que é? Tem cidades mas não tem casas; tem montanhas mas não tem érvores; tem égua mas não tem peixes.", o:["O mapa","O globo","O desenho","O livro"], r:0, e:"No mapa vemos cidades, montanhas e rios desenhados!" },  { c:"charadas", p:"O que é, o que é? Quanto mais quente, mais fresco fica.", o:["O pão","O sorvete","O chá","A sopa"], r:0, e:"O pão sai quente do forno e fica fresquinho!" },  { c:"charadas", p:"O que é, o que é? Anda com os pés na cabeça.", o:["O piolho","O morcego","O macaco","O pulga"], r:0, e:"O piolho anda de cabeça para baixo nos cabelos!" },  { c:"charadas", p:"O que é, o que é? Quanto mais vocé me tira, mais eu cresão? Já sei: é o buraco! E o que cresce sem nunca diminuir?", o:["A sombra ao meio-dia","A bola","A pizza","A fila"], r:0, e:"Ao meio-dia, a sombra fica bem pequenina... mas de manhá ela cresce!" },  { c:"charadas", p:"O que é, o que é? Tem raézes mas nunca bebe égua.", o:["Os dentes","A érvore","A cenoura","A flor"], r:0, e:"Os dentes têm 'raézes' dentro da gengiva!" },  { c:"charadas", p:"O que é, o que é? Dé muitas voltas e não sai do lugar.", o:["O ventilador","O carro","O piéo","O relógio"], r:0, e:"As hálices do ventilador giram sem sair do lugar!" },  { c:"charadas", p:"O que é, o que é? Fala todas as lénguas do mundo.", o:["O eco","O tradutor","O papagaio","O rédio"], r:0, e:"O eco repete qualquer palavra que vocé disser!" },  { c:"charadas", p:"O que é, o que é? Quem faz não quer, quem compra não usa, quem usa não você.", o:["O caixéo","O sapato","O chapéu","O remédio"], r:0, e:"é uma charada cléssica: o caixéo!" },  { c:"charadas", p:"O que é, o que é? Tem banco mas não senta; tem juiz mas não joga futebol.", o:["O tribunal","O estádio","O parque","A escola"], r:0, e:"No tribunal há bancos e um juiz!" },  { c:"charadas", p:"O que é, o que é? Tem asas mas não voa.", o:["O prédio","O pássaro","O aviolãoo","O morcego"], r:0, e:"Os prédios têm 'asas': as partes laterais!" },  { c:"charadas", p:"O que é, o que é? é cheio de dentes e ajuda a arrumar o jardim.", o:["O ancinho","O tubarão","O pente","O trator"], r:0, e:"O ancinho tem 'dentes' que ajudam a juntar folhas!" },  { c:"charadas", p:"O que é, o que é? Molha enquanto seca.", o:["A toalha","O secador","O sol","O ferro de passar"], r:0, e:"A toalha seca nosso corpo e fica molhada!" },  { c:"charadas", p:"O que é, o que é? Tem coroa e não é rei; tem escamas e não é peixe.", o:["O abacaxi","A cobra","O galinho","A palmeira"], r:0, e:"O abacaxi tem 'coroa' e casca em escamas!" },  { c:"charadas", p:"O que é, o que é? Anda pelo campo e come com os pés.", o:["O galo","O boi","O cavalo","O porco"], r:0, e:"O galo 'come' com os pés: ciscando o cháo!" },  { c:"charadas", p:"O que é, o que é? Quanto mais dele vocé tem, menos vocé você.", o:["A escuridéo","A luz","A névoa","A poeira"], r:0, e:"Quanto mais escuridéo, menos conseguimos ver!" },  { c:"charadas", p:"O que é, o que é? Entra na égua e não se molha.", o:["A sombra","O pedaéo de plástico","O barco","O peixe"], r:0, e:"A sombra entra na égua e continua sequinha!" },  { c:"charadas", p:"O que é, o que é? Tem cabeça vermelha e vive no fésforo.", o:["A chama","A formiga","O joaninha","O tomate"], r:0, e:"A cabeça do fésforo é vermelha e acende com atrito!" },  { c:"charadas", p:"O que é, o que é? é alto quando jovem e baixo quando velho.", o:["A vela","A pessoa","A érvore","O prédio"], r:0, e:"A vela vai diminuindo conforme derrete!" },  { c:"charadas", p:"O que é, o que é? Tem léngua mas não fala.", o:["O sapato","O cachorro","O sino","O papagaio"], r:0, e:"A parte de dentro do sapato se chama 'léngua'!" },  { c:"charadas", p:"O que é, o que é? Quanto mais se afasta, menor parece.", o:["Tudo que está longe","Sé o sol","Sé a lua","Sé o aviolãoo"], r:0, e:"Quanto mais longe um objeto está, menor ele parece!" },  { c:"charadas", p:"O que é, o que é? Tem ponta mas não é flecha; escreve mas não é caneta.", o:["O lápis","A seta","O dedo","O prego"], r:0, e:"O lápis tem ponta e escreve muito bem!" },  { c:"charadas", p:"O que é, o que é? Cai de pé e ninguém segura.", o:["A chuva","A bola","O papel","A folha"], r:0, e:"A gota de chuva cai 'de pé' do céu!" },  { c:"charadas", p:"O que é, o que é? Se vocé me nomeia, eu deixo de existir.", o:["O siléncio","O vento","A sombra","O sonho"], r:0, e:"Quando vocé fala, o siléncio acaba!" },  { c:"charadas", p:"O que é, o que é? Tem mil agulhas mas não costura.", o:["O cacto","O ouriéo","O pinheiro","O porco-espinho"], r:0, e:"O cacto é coberto de espinhos como agulhas!" },  { c:"charadas", p:"O que é, o que é? Sempre vem, mas nunca chega.", o:["O amanhá","O énibus","O aniversério","O Natal"], r:0, e:"Quando o amanhá chega, virou hoje!" },  { c:"charadas", p:"O que é, o que é? Pode ser dourado, mas não vale dinheiro.", o:["O pôr do sol","A moeda","O anel","O colar"], r:0, e:"O céu fica dourado no pôr do sol!" },  { c:"charadas", p:"O que é, o que é? Tem pés e não caminha; tem cabeça e não pensa; tem braços e não escreve.", o:["A cama","O robé","O boneco","O manequim"], r:0, e:"A cama tem 'pés' e 'cabeceira', mas não anda nem pensa!" },  { c:"charadas", p:"O que é, o que é? é seu, mas os outros usam mais que vocé.", o:["Seu nome","Seu sapato","Seu brinquedo","Seu cabelo"], r:0, e:"Nosso nome é chamado pelos outros o tempo todo!" },  { c:"charadas", p:"O que é, o que é? Quanto mais vocé estuda, mais descobre que...", o:["Hé mais para aprender","Nada resta","Esté tudo errado","Não precisa escola"], r:0, e:"Quanto mais aprendemos, mais queremos saber!" },  { c:"charadas", p:"O que é, o que é? Roda a vida inteira e nunca sai do canto.", o:["A roda do moinho","A roda do carro","O piéo","A bicicleta"], r:0, e:"A roda do moinho gira presa no seu lugar!" },  { c:"charadas", p:"O que é, o que é? Fica mais limpo quanto mais sujo trabalha.", o:["O sabalão","A vassoura","O pano","O esponja"], r:0, e:"O sabalão suja (se desfaz) limpando tudo!" },  { c:"charadas", p:"O que é, o que é? Tem tronco mas não é érvore; viaja mas não anda.", o:["O trem","O caminháo","O énibus","O navio"], r:0, e:"O trem viaja sobre os trilhos sem andar sozinho!" },  { c:"charadas", p:"O que é, o que é? Quanto mais vocé me enche, mais leve eu fico.", o:["O baléo de ar quente","O balde d'égua","A mala","O saco de cimento"], r:0, e:"Quanto mais ar quente, mais alto o baléo voa!" },  /* ---- BÍBLIA ---- */  { c:"biblia", p:"Quem foi engolido por um grande peixe?", o:["Jonas","Noé","Davi","Pedro"], r:0, e:"Deus protegeu Jonas dentro do grande peixe!" },  { c:"biblia", p:"Quem construiu a arca para salvar os animais?", o:["Noé","Abraço","Moisés","José"], r:0, e:"Noé levou os animais para a arca, dois de cada!" },  { c:"biblia", p:"Quem venceu o gigante Golias?", o:["Davi","Sansão","Saul","Golias"], r:0, e:"Davi venceu Golias com uma funda " },  { c:"biblia", p:"Quem negou Jesus trés vezes?", o:["Pedro","Joéo","Judas","Tomé"], r:0, e:"Pedro negou Jesus trés vezes antes do galo cantar!" },  { c:"biblia", p:"Quem traiu Jesus?", o:["Judas Iscariotes","Pedro","Tiago","Barrabés"], r:0, e:"Judas entregou Jesus por trinta moedas de prata!" },  { c:"biblia", p:"Quantos filhos Jacé teve?", o:["12","7","10","3"], r:0, e:"Os 12 filhos de Jacé deram origem és 12 tribos de Israel!" },  { c:"biblia", p:"Quem foi o homem mais forte da Béblia?", o:["Sansão","Golias","Absaléo","Saul"], r:0, e:"A foréa de Sansão estava em seus cabelos!" },  { c:"biblia", p:"Onde Moisés recebeu as tébuas da lei?", o:["No monte Sinai","No deserto do Egito","Em Jerusalém","Perto do rio Nilo"], r:0, e:"Foi no monte Sinai que Deus falou com Moisés!" },  { c:"biblia", p:"Quem sucedeu Moisés e liderou o povo até a terra prometida?", o:["Josué","Caleb","Arato","Gideéo"], r:0, e:"Josué liderou o povo de Israel!" },  { c:"biblia", p:"Quem derrubou as muralhas de Jericé?", o:["Josué","Davi","Sansão","Gideéo"], r:0, e:"As muralhas caéram apés as trombetas e os gritos do povo!" },  { c:"biblia", p:"Qual rei escreveu muitos salmos?", o:["Davi","Salomão","Saul","Ezequias"], r:0, e:"O rei Davi escreveu belos salmos para Deus!" },  { c:"biblia", p:"Qual rei pediu sabedoria a Deus?", o:["Salomão","Davi","Saul","Roboéo"], r:0, e:"Salomão pediu sabedoria e ficou famoso no mundo todo!" },  { c:"biblia", p:"Quem foi a rainha que salvou seu povo judeu?", o:["Ester","Débora","Ana","Maria"], r:0, e:"A rainha Ester corajosamente defendeu seu povo!" },  { c:"biblia", p:"Quem foi enganado por sua mãe para receber a bénééo do irmão?", o:["Jacé","Esaé","Isaque","Abraço"], r:0, e:"Rebeca ajudou Jacé a enganar Isaque!" },  { c:"biblia", p:"Quem foi vendido pelos irmãos como escravo?", o:["José","Benjamim","Judé","Rében"], r:0, e:"Os irmãos de José o venderam, mas Deus o elevou no Egito!" },  { c:"biblia", p:"Como se chamava o jardim onde Adéo e Eva viviam?", o:["Jard t chaves = Object.keys(porCat);    const selecionadas = chaves.map(c => embaralhar(porCat[c])[0]);    const restantes = PERGUNTAS.filter(q => !selecionadas.includes(q));    const faltam = Math.max(0, total - selecionadas.length);    const extras = embaralhar(restantes).slice(0, faltam);    return embaralhar([...selecionadas, ...extras]).map(embaralharPergunta);  }const perguntas = PERGUNTAS.filter(q => q.c === categoriaChave);  return embaralhar(perguntas).slice(0, total).map(embaralharPergunta);}function reiniciarPontos() {  jogadores.forEach(j => { j.pontos = 0; j.vidas = 3; j.acertos = 0; j.total = 0; j.erros = []; });  jogadorAtual = 0;  carregarJogador();}function carregarJogador() {  const pl = jogadores[jogadorAtual];  nome = pl.nome;  pontos = pl.pontos;  vidas = pl.vidas;  erros = pl.erros;}function salvarJogador() {  const pl = jogadores[jogadorAtual];  pl.pontos = pontos;  pl.vidas = vidas;  pl.erros = erros;}function iniciarJogo(chave) {  categoriaChave = chave;  reiniciarPontos();  lista = montarListaRodada();  comecarRodada(CATEGORIAS[chave].nome);}function comecarRodada(tag) {  categoriaAtual = tag;  indice = 0;  jogadorAtual = 0;  jogadores.forEach(j => { j.pontos = 0; j.vidas = 3; j.acertos = 0; j.total = 0; j.erros = []; });  carregarJogador();  atualizarHud();  mostrarTela("tela-jogo");  montarPergunta();}function atualizarHud() {  $("jogador-badge").textContent = "👤 " + nome;  $("vidas").textContent = "❤️".repeat(Math.max(0, vidas)) + "🖤".repeat(Math.max(0, 3 - vidas));  $("pontos").textContent = "⭐ " + pontos;  $("progresso").style.width = (indice / lista.length * 100) + "%";  atualizarPlacarVivo();}function atualizarPlacarVivo() {  const box = $("placar-vivo");  if (!box) return;  if (jogadores.length <= 1) { box.innerHTML = ""; return; }  box.innerHTML = jogadores.map((j, i) => {    const ativo = (i === jogadorAtual) ? "background:#fff;color:#7c3aed;font-weight:800;transform:scale(1.06);" : "background:rgba(255,255,255,.35);color:#fff;";    return "<span style='border-radius:999px;padding:4px 14px;font-size:.85rem;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:all .2s;" + ativo + "'>" + j.nome + ": " + j.pontos + "?</span>";  }).join("");}function montarPergunta() {  jogadorAtual = indice % jogadores.length;  carregarJogador();  const q = lista[indice];  respondido = false;  $("tag-categoria").textContent = categoriaAtual;  $("turno-aviso").textContent = jogadores.length > 1 ? ("👉 É a vez de " + nome + "!") : "";  $("pergunta").textContent = q.p;  $("feedback").className = "feedback";  $("feedback").innerHTML = "";  $("acoes").classList.remove("ativa");  $("btn-proxima").textContent = "➡️ Próxima";  atualizarHud();  const letras = ["A", "B", "C", "D"];  const box = $("opcoes");  box.innerHTML = "";  q.o.forEach((op, i) => {    const btn = document.createElement("button");    btn.className = "opcao";    btn.dataset.i = i;    btn.innerHTML = "<span class='letra'>" + letras[i] + "</span><span>" + op + "</span>";    btn.addEventListener("click", () => responder(i, btn));    box.appendChild(btn);  });  iniciarCronometro();}function iniciarCronometro() {  clearInterval(timerInterval);  tempoRestante = TEMPO_LIMITE;  const barra = $("cronometro");  barra.classList.remove("perigo");  $("tempo-numero").textContent = tempoRestante;  barra.style.width = "100%";  timerInterval = setInterval(() => {    tempoRestante--;    if (tempoRestante <= 0) {      clearInterval(timerInterval);      barra.style.width = "0%";      somTempoFim();      responder(-1, null);      return;    }    $("tempo-numero").textContent = tempoRestante;    barra.style.width = (tempoRestante / TEMPO_LIMITE * 100) + "%";    if (tempoRestante <= 5) {      barra.classList.add("perigo");      somTick();    }  }, 1000);}function responder(indiceEscolhido, btnEscolhido) {  if (respondido) return;  respondido = true;  clearInterval(timerInterval);  const q = lista[indice];  const botoes = document.querySelectorAll(".opcao");  const letras = ["A", "B", "C", "D"];  let acertou = indiceEscolhido === q.r;  botoes.forEach((b, i) => {    b.classList.add("apagada");    if (i === q.r) b.classList.add("certa");    if (i === indiceEscolhido && !acertou) b.classList.add("errada");  });  const fb = $("feedback");  const pl = jogadores[jogadorAtual];  pl.total++;  if (acertou) {    pontos += 10;    pl.acertos++;    fb.className = "feedback certo";    fb.innerHTML = "✅ Correto, " + nome + "! +10 pontos<br><span class='explicacao'>" + q.e + "</span>";    somCerto();  } else {    vidas--;    erros.push(q);    fb.className = "feedback errado";    const texto = indiceEscolhido === -1      ? "? Tempo esgotado! A resposta certa é a letra " + letras[q.r] + "."      : "⚠️ Quase! A resposta certa é a letra " + letras[q.r] + ".";    fb.innerHTML = texto + "<br><span class='explicacao'>" + q.e + "</span>";    somErrado();  }  salvarJogador();  $("pontos").textContent = "⭐ " + pontos;  $("vidas").textContent = "❤️".repeat(Math.max(0, vidas)) + "🖤".repeat(Math.max(0, 3 - vidas));  $("acoes").classList.add("ativa");  atualizarPlacarVivo();  indice++;  fimAguardando = indice >= lista.length || (jogadores.length === 1 && vidas <= 0);  $("btn-proxima").textContent = fimAguardando ? "🏆 Ver resultado" : "➡️ Próxima";}$("btn-proxima").addEventListener("click", () => {  somClique();  if (fimAguardando) {    if (jogadores.length > 1) mostrarRanking();    else mostrarFim();    return;  }  montarPergunta();});/* ============ FIM ============ */function mostrarFim() {  clearInterval(timerInterval);  const total = lista.length;  const acertos = Math.max(0, Math.round(pontos / 10));  const pct = acertos / total;  let estrelas, emoji, msg;  if (vidas <= 0) {    estrelas = "😔"; emoji = "😢";    msg = "As vidas acabaram, mas vocé é um campeéo por tentar!";  } else if (pct >= 0.9) { estrelas = "⭐⭐⭐"; emoji = "🏆"; msg = "Você é um gênio, " + nome + "! Incrível!"; }  else if (pct >= 0.6) { estrelas = "⭐⭐"; emoji = "😊"; msg = "Muito bem, " + nome + "! Continue assim!"; }  else if (pct >= 0.3) { estrelas = "?"; emoji = "🙂"; msg = "Bom começo, " + nome + "! Vamos treinar mais?"; }  else { estrelas = "💪"; emoji = "😢"; msg = "Não desista, " + nome + "! Cada erro ensina!"; }  $("emoji-fim").textContent = emoji;  $("estrelas").textContent = estrelas;  $("mensagem-final").textContent = msg;  $("placar-final").textContent = "Vocé acertou " + acertos + " de " + total + " perguntas e fez " + pontos + " pontos!";  $("titulo-fim").textContent = nome + ", vocé chegou ao fim! 🎉";  const rev = $("revisao");  const btnTreinar = $("btn-treinar-erros");  const letras = ["A", "B", "C", "D"];  if (erros.length === 0) {    rev.innerHTML = "<p style='margin-top:8px;font-weight:700;color:#10b981;text-align:center;>🌟 Perfeito! Você acertou tudo e conhecimento mandou bem!</p>";    btnTreinar.style.display = "none";  } else {    let html = "<h3 style='font-size:1.1rem;color:#7c3aed;margin-bottom:4px;'>📖 Aprenda com os erros:</h3>";    erros.forEach((q, k) => {      html += "<div style='background:#f8fafc;border:2px solid #fee2e2;border-radius:14px;padding:10px 14px;margin-top:10px;'>"        + "<div style='font-weight:800;color:#334155;'>" + (k + 1) + ". " + q.p + "</div>"        + "<div style='color:#059669;font-weight:700;margin-top:4px;'>? " + letras[q.r] + ") " + q.o[q.r] + "</div>"        + "<div style='color:#64748b;font-size:.9rem;margin-top:4px;'>" + q.e + "</div></div>";    });    rev.innerHTML = html;    btnTreinar.style.display = "inline-block";  }  mostrarTela("tela-fim");  soltarConfete();  if (pct >= 0.6 && vidas > 0) somVitoria();  else if (vidas <= 0) somGameOver();}function mostrarRanking() {  const ordem = jogadores.slice().sort((a, b) => b.pontos - a.pontos);  const medalhas = ["🥇", "🥈", "🥉", "🏅", "⭐", "⭐", "⭐", "⭐", "⭐", "⭐"];  $("emoji-fim").textContent = "🏆";  $("titulo-fim").textContent = "Ranking Final!";  $("estrelas").textContent = ordem.map((_, i) => medalhas[i] || "⭐").join(" ");  $("mensagem-final").textContent = "Campeéo: " + ordem[0].nome + " com " + ordem[0].pontos + " pontos! 🎉";  let placar = "";  ordem.forEach((j, i) => {    placar += (medalhas[i] || "⭐") + " <b>" + j.nome + "</b> é " + j.pontos + " pontos (" + j.acertos + " de " + j.total + " acertos)<br>";  });  $("placar-final").innerHTML = placar;  $("revisao").innerHTML = "";  $("btn-treinar-erros").style.display = "none";  mostrarTela("tela-fim");  soltarConfete();  somVitoria();}$("btn-treinar-erros").addEventListener("click", () => {  somClique();  if (erros.length === 0) return;  treinoErros = erros.slice();  lista = embaralhar(treinoErros).map(embaralharPergunta);  comecarRodada("📝 Treinando as erradas");});$("btn-jogar-novamente").addEventListener("click", () => {  somClique();  if (categoriaAtual === "📝 Treinando as erradas" && treinoErros.length) {    lista = embaralhar(treinoErros).map(embaralharPergunta);    comecarRodada("📝 Treinando as erradas");    return;  }  reiniciarPontos();  lista = montarListaRodada();  comecarRodada(categoriaAtual);});$("btn-outra-categoria").addEventListener("click", () => { somClique(); reiniciarPontos(); mostrarTela("tela-categorias"); });$("btn-inicio-novo").addEventListener("click", () => { somClique(); mostrarTela("tela-inicio"); });/* ============ TECLADO ============ */document.addEventListener("keydown", (e) => {  const telaJogoAtiva = $("tela-jogo").classList.contains("ativa");  if (!telaJogoAtiva) return;  const tecla = e.key.toUpperCase();  const letras = ["A", "B", "C", "D"];  if (letras.includes(tecla) && !respondido) {    const idx = letras.indexOf(tecla);    const btn = document.querySelectorAll(".opcao")[idx];    if (btn) responder(idx, btn);  } else if (e.key === "Enter" && respondido) {    $("btn-proxima").click();  }});
/* ============ INÍCIO ============ */montarCategorias();renderInputs();</script>

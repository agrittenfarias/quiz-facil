<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Kids - Aventura do Saber</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Chalkboard SE", sans-serif;
    background: linear-gradient(135deg, #7c3aed, #db2777, #f59e0b);
    background-size: 400% 400%;
    animation: fundo 12s ease infinite;
    color: #333;
    overflow-x: hidden;
  }
  @keyframes fundo {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #app { max-width: 820px; margin: 0 auto; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }

  .tela { display: none; flex-direction: column; align-items: center; animation: aparecer .4s ease; }
  .tela.ativa { display: flex; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  .cartao {
    background: #fff;
    border-radius: 28px;
    padding: 28px 24px;
    width: 100%;
    box-shadow: 0 16px 40px rgba(0,0,0,.25);
    text-align: center;
    position: relative;
  }

  h1 {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    color: #7c3aed;
    line-height: 1.2;
  }
  .emoji-grande { font-size: clamp(3rem, 10vw, 5rem); display: block; margin-bottom: 8px; animation: pulo 1.5s ease infinite; }
  @keyframes pulo { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .subtitulo { color: #666; margin-top: 8px; font-size: 1.05rem; }

  .input-nome {
    width: 100%;
    max-width: 360px;
    padding: 14px 18px;
    font-size: 1.1rem;
    border: 3px solid #ddd;
    border-radius: 16px;
    margin: 18px 0 6px;
    text-align: center;
    outline: none;
    font-family: inherit;
  }
  .input-nome:focus { border-color: #7c3aed; }

  .botao {
    font-family: inherit;
    border: none;
    cursor: pointer;
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    border-radius: 999px;
    padding: 15px 34px;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }
  .botao:hover { transform: scale(1.05); }
  .botao:active { transform: scale(.95); }
  .botao-roxa { background: linear-gradient(135deg,#8b5cf6,#7c3aed); }
  .botao-verde { background: linear-gradient(135deg,#34d399,#10b981); }
  .botao-laranja { background: linear-gradient(135deg,#fbbf24,#f59e0b); color:#5b3a00; }
  .botao-azul { background: linear-gradient(135deg,#60a5fa,#3b82f6); }

  .grade-categorias {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin-top: 20px;
    width: 100%;
  }
  .cat-btn {
    font-family: inherit;
    border: none;
    border-radius: 20px;
    padding: 18px 8px;
    cursor: pointer;
    font-weight: 700;
    color: #fff;
    font-size: 1rem;
    box-shadow: 0 6px 14px rgba(0,0,0,.2);
    transition: transform .15s;
    line-height: 1.4;
  }
  .cat-btn:hover { transform: scale(1.06); }
  .cat-btn:active { transform: scale(.94); }
  .cat-btn .icone { font-size: 2rem; display: block; margin-bottom: 6px; }

  /* Barra superior do jogo */
  .topo-jogo { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
  .vidas { font-size: 1.6rem; letter-spacing: 4px; }
  .pontos-badge {
    background: #fff;
    border-radius: 999px;
    padding: 6px 16px;
    font-weight: 800;
    box-shadow: 0 4px 10px rgba(0,0,0,.15);
    font-size: 1.05rem;
  }
  .som-btn {
    border: none;
    background: #fff;
    border-radius: 999px;
    width: 42px; height: 42px;
    font-size: 1.3rem;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.15);
  }

  .progresso { width: 100%; height: 14px; background: rgba(255,255,255,.5); border-radius: 999px; overflow: hidden; margin-bottom: 16px; }
  .progresso-interno { height: 100%; width: 0%; background: linear-gradient(90deg,#34d399,#10b981); border-radius: 999px; transition: width .4s; }

  .cronometro-box { width: 100%; margin-bottom: 14px; }
  .cronometro-texto { font-weight: 800; color: #fff; font-size: .9rem; margin-bottom: 4px; text-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .cronometro { width: 100%; height: 18px; background: rgba(0,0,0,.25); border-radius: 999px; overflow: hidden; }
  .cronometro-interno { height: 100%; width: 100%; background: #34d399; border-radius: 999px; transition: width 1s linear; }
  .cronometro-interno.perigo { background: #ef4444; }

  .pergunta {
    font-size: clamp(1.2rem, 4vw, 1.7rem);
    font-weight: 800;
    color: #1f2937;
    margin-bottom: 22px;
    line-height: 1.35;
  }
  .tag-categoria {
    display: inline-block;
    background: #f3e8ff;
    color: #7c3aed;
    font-weight: 700;
    border-radius: 999px;
    padding: 4px 14px;
    font-size: .85rem;
    margin-bottom: 12px;
  }
  .opcoes { display: grid; gap: 12px; width: 100%; }
  .opcao {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f8fafc;
    border: 3px solid #e2e8f0;
    border-radius: 18px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
    text-align: left;
    transition: all .15s;
  }
  .opcao:hover { border-color: #8b5cf6; transform: translateX(4px); }
  .letra {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #7c3aed;
    color: #fff;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .95rem;
  }
  .opcao.certa { background: #d1fae5; border-color: #10b981; animation: balancar .5s; }
  .opcao.certa .letra { background: #10b981; }
  .opcao.errada { background: #fee2e2; border-color: #ef4444; animation: tremer .4s; }
  .opcao.errada .letra { background: #ef4444; }
  .opcao.apagada { opacity: .5; pointer-events: none; }
  @keyframes balancar { 0%,100%{transform:scale(1);} 40%{transform:scale(1.05) rotate(-2deg);} 70%{transform:scale(.97);} }
  @keyframes tremer { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 50%{transform:translateX(8px);} 75%{transform:translateX(-5px);} }

  .feedback { display: none; margin-top: 16px; padding: 14px 18px; border-radius: 16px; font-weight: 700; font-size: 1.05rem; }
  .feedback.certo { background: #d1fae5; color: #065f46; }
  .feedback.errado { background: #fee2e2; color: #991b1b; }
  .feedback .explicacao { font-weight: 500; margin-top: 6px; font-size: .95rem; opacity: .9; }
  .acoes { margin-top: 14px; width: 100%; display: none; }
  .acoes.ativa { display: block; }

  .estrelas { font-size: clamp(2.5rem, 10vw, 4rem); letter-spacing: 8px; margin: 10px 0; }
  .mensagem-final { font-size: 1.2rem; font-weight: 700; color: #1f2937; margin-bottom: 4px; }
  .placar-final { font-size: 1rem; color: #666; margin-bottom: 20px; }
  .botoes-finais { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  .seletor { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 14px 0 6px; }
  .stepper-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: #7c3aed;
    color: #fff;
    font-size: 1.6rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.2);
    transition: transform .15s;
  }
  .stepper-btn:hover { transform: scale(1.1); }
  .stepper-num { font-size: 2.2rem; font-weight: 800; color: #7c3aed; min-width: 44px; }
  #inputs-nomes { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 8px; }

  #confete { position: fixed; inset: 0; pointer-events: none; z-index: 999; }

  @media (max-width: 480px) {
    .cartao { padding: 20px 14px; }
    .grade-categorias { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="app">

  <!-- TELA INÍCIO -->
  <section id="tela-inicio" class="tela ativa">
    <div class="cartao">
      <span class="emoji-grande">🧠</span>

      <div class="cronometro-box">

        <div class="cronometro"><div class="cronometro-interno" id="cronometro"></div></div>
      </div>

      <div id="turno-aviso" style="font-weight:800;color:#7c3aed;margin:6px 0 10px;font-size:1.05rem;"></div>

      <div class="opcoes" id="opcoes"></div>

      <div class="acoes" id="acoes">

  <!-- TELA FIM -->
  <section id="tela-fim" class="tela">
    <div class="cartao">

      <h1 id="titulo-fim">Fim de Jogo!</h1>

      <p class="mensagem-final" id="mensagem-final"></p>

      <div id="revisao" style="margin: 12px 0 4px; width: 100%; text-align: left;"></div>
      <div class="botoes-finais">
        <button class="botao botao-laranja" id="btn-treinar-erros" style="display:none;">🔄 Treinar as erradas</button>
        <button class="botao botao-verde" id="btn-jogar-novamente">🔄 Jogar de novo</button>

    </div>

</div>

<script>
"use strict";

/* ============ SONS (Web Audio) ============ */
let ctxAudio = null;
let somLigado = true;
function audio() {
  if (!ctxAudio) {
    try { ctxAudio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  return ctxAudio;
}
function tocarNota(freq, inicio, dur, tipo) {
  if (!somLigado) return;
  const ctx = audio(); if (!ctx) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = tipo || "triangle";
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, ctx.currentTime + inicio);
  g.gain.linearRampToValueAtTime(0.18, ctx.currentTime + inicio + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + inicio + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(ctx.currentTime + inicio);
  o.stop(ctx.currentTime + inicio + dur + 0.05);
}
function somClique() { tocarNota(600, 0, 0.08, "square"); }
function somCerto() { [523.25, 659.25, 783.99].forEach((f, i) => tocarNota(f, i * 0.12, 0.18)); }
function somErrado() { tocarNota(220, 0, 0.2, "sawtooth"); tocarNota(160, 0.18, 0.3, "sawtooth"); }
function somTick() { tocarNota(1000, 0, 0.06, "square"); }
function somTempoFim() { tocarNota(140, 0, 0.4, "sawtooth"); }
function somVitoria() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tocarNota(f, i * 0.15, 0.3)); }
function somGameOver() { [400, 300, 210, 150].forEach((f, i) => tocarNota(f, i * 0.2, 0.25, "sawtooth")); }

  { c:"logica", p:"Se o sol está se pondo, qual período do dia está começando?", o:["Noite","Manhã","Tarde","Madrugada"], r:0, e:"Quando o sol se põe, começa a noite!" },
  { c:"logica", p:"Quantos dedos têm as duas mãos juntas?", o:["10","5","8","12"], r:0, e:"Cada mão tem 5 dedos: 5 + 5 = 10!" },
  { c:"logica", p:"Uma semana tem quantos dias?", o:["7","5","6","10"], r:0, e:"A semana tem 7 dias!" },

  { c:"logica", p:"Se você girar uma moeda, quais resultados podem sair?", o:["Cara ou coroa","Só cara","Só coroa","Nenhum"], r:0, e:"A moeda pode cair com cara ou coroa para cima!" },
  { c:"logica", p:"Em um jogo de futebol, seu time fez 2 gols no 1º tempo e 1 no 2º. Quantos gols no total?", o:["3","2","4","1"], r:0, e:"2 + 1 = 3 gols!" },
  { c:"logica", p:"Maria tem o dobro da idade do irmão de 5 anos. Quantos anos Maria tem?", o:["10","15","7","12"], r:0, e:"O dobro de 5 é 10!" },
  { c:"logica", p:"Um trem viaja mais rápido que um carro, e o carro mais rápido que a bicicleta. O que é mais lento?", o:["Bicicleta","Carro","Trem","Avião"], r:0, e:"A bicicleta é o mais lento dos três!" },
  { c:"logica", p:"Se 1 real compra 1 bala, quantas balas 5 reais compram?", o:["5","4","6","10"], r:0, e:"5 reais compram 5 balas!" },
  { c:"logica", p:"Que forma tem uma bola de futebol?", o:["Redonda (esfera)","Quadrada","Triangular","Cúbica"], r:0, e:"A bola é redonda, como uma esfera!" },
  { c:"logica", p:"Quantos cantos tem um triângulo?", o:["3","4","5","2"], r:0, e:"O triângulo tem 3 cantos e 3 lados!" },
  { c:"logica", p:"Quantos cantos tem um cubo (como um dado)?", o:["8","6","12","4"], r:0, e:"O cubo tem 8 cantinhos!" },
  { c:"logica", p:"Se você dobrar uma folha de papel ao meio duas vezes, em quantas partes ela fica?", o:["4","2","3","8"], r:0, e:"Dobrar duas vezes divide em 4 partes!" },
  { c:"logica", p:"Ana chegou antes de Bia, e Bia chegou antes de Cris. Quem chegou primeiro?", o:["Ana","Bia","Cris","Empataram"], r:0, e:"Ana chegou antes de todas!" },
  { c:"logica", p:"Se todo domingo você nada, e hoje você nadou, hoje pode ser...", o:["Domingo","Segunda obrigatoriamente","Sábado obrigatoriamente","Nunca foi domingo"], r:0, e:"Se você só nada aos domingos e nadou, hoje é domingo!" },
  { c:"logica", p:"O que pesa mais: 1 quilo de algodão ou 1 quilo de ferro?", o:["Pesam igual","O ferro","O algodão","Depende da cor"], r:0, e:"Os dois pesam exatamente 1 quilo!" },
  { c:"logica", p:"Quantas pernas têm 3 galinhas?", o:["6","4","8","3"], r:0, e:"Cada galinha tem 2 pernas: 2 x 3 = 6!" },
  { c:"logica", p:"Se você tem meia dúzia de ovos, quantos ovos são?", o:["6","3","12","5"], r:0, e:"Meia dúzia é 6!" },
  { c:"logica", p:"Uma dúzia de ovos menos 5 ovos. Quantos sobram?", o:["7","6","8","5"], r:0, e:"12 - 5 = 7 ovos!" },
  { c:"logica", p:"Qual é o próximo: janeiro, fevereiro, março, ...?", o:["Abril","Maio","Junho","Dezembro"], r:0, e:"Depois de março vem abril!" },
  { c:"logica", p:"Qual estação vem depois do inverno?", o:["Primavera","Verão","Outono","Inverno de novo"], r:0, e:"Depois do inverno floresce a primavera!" },
  { c:"logica", p:"Se você olhar no espelho e levantar a mão direita, qual mão seu reflexo levanta?", o:["A esquerda","A direita","As duas","Nenhuma"], r:0, e:"O espelho inverte os lados!" },
  { c:"logica", p:"Numa corrida, você ultrapassa o segundo colocado. Em que posição fica?", o:["Segundo","Primeiro","Terceiro","Último"], r:0, e:"Ao passar o segundo, você assume o segundo lugar!" },
  { c:"logica", p:"Quantas vezes a letra 'a' aparece na palavra 'banana'?", o:["3","2","4","1"], r:0, e:"ba-na-na: três letras 'a'!" },

  /* ---- CHARADAS ---- */
  { c:"charadas", p:"O que é, o que é? Tem dentes mas não morde.", o:["O pente","A tesoura","O garfo","O gato"], r:0, e:"O pente tem 'dentes' e serve para pentear o cabelo!" },
  { c:"charadas", p:"O que é, o que é? Anda deitado e dorme em pé.", o:["O pé","O relógio","O pato","A cadeira"], r:0, e:"O nosso pé anda deitado no chão e 'dorme' em pé!" },
  { c:"charadas", p:"O que é, o que é? Quanto mais seca, mais molhada fica.", o:["A toalha","A esponja","A roupa","A nuvem"], r:0, e:"A toalha seca a gente e depois fica toda molhada!" },
  { c:"charadas", p:"O que é, o que é? Tem capa, mas não é super-herói; tem coroa, mas não é rei.", o:["O abacaxi","O bolo","O pirata","O cachorro"], r:0, e:"O abacaxi tem coroa e uma capa bem grossa!" },
  { c:"charadas", p:"O que é, o que é? Cai em pé e corre deitado.", o:["A chuva","O vento","A bola","A neve"], r:0, e:"A chuva cai em pé e depois corre deitada pelo chão!" },
  { c:"charadas", p:"O que é, o que é? Verde por fora e vermelho por dentro.", o:["A melancia","A maçã","A banana","A uva"], r:0, e:"A melancia é verde por fora e tem miolo vermelho!" },
  { c:"charadas", p:"O que é, o que é? Enche uma casa, mas não pesa nada.", o:["A luz","A água","O bolo","A areia"], r:0, e:"A luz enche a casa inteira e não pesa nada!" },
  { c:"charadas", p:"O que é, o que é? Tem orelha, mas não ouve.", o:["A panela","O coelho","O cachorro","O gato"], r:0, e:"A panela tem 'orelhas' (alças), mas não ouve nada!" },
  { c:"charadas", p:"O que é, o que é? Tem pescoço mas não tem cabeça.", o:["A garrafa","O girafa","O sapo","A cadeira"], r:0, e:"A garrafa tem 'pescoço', mas não tem cabeça!" },
  { c:"charadas", p:"O que é, o que é? Tem pernas mas não anda.", o:["A mesa","O cachorro","O relógio","O avião"], r:0, e:"A mesa tem 'pernas' e fica parada no lugar!" },
  { c:"charadas", p:"O que é, o que é? Tem braços mas não abraça.", o:["O sofá","O macaco","O robô","O boneco"], r:0, e:"As 'braças' do sofá são os apoios dos lados!" },
  { c:"charadas", p:"O que é, o que é? Nasce grande e morre pequeno.", o:["O lápis","O balão","O pão","O coelho"], r:0, e:"O lápis nasce comprido e vai ficando pequeno com o uso!" },
  { c:"charadas", p:"O que é, o que é? Quanto mais tira, maior fica.", o:["O buraco","O bolo","A bola","O copo"], r:0, e:"Quanto mais terra você tira, maior fica o buraco!" },
  { c:"charadas", p:"O que é, o que é? Sobe e desce e nunca se cansa.", o:["A escada","O elevador","O pássaro","O balão"], r:0, e:"A escada serve para subir e descer sem cansar!" },
  { c:"charadas", p:"O que é, o que é? Fica no céu de dia e some à noite.", o:["O sol","A lua","A estrela","O avião"], r:0, e:"O sol brilha de dia e se põe à noite!" },
  { c:"charadas", p:"O que é, o que é? Brilha no céu à noite.", o:["A lua","O sol","A nuvem","O arco-íris"], r:0, e:"A lua (e as estrelas) iluminam a noite!" },
  { c:"charadas", p:"O que é, o que é? Anda para cima e para baixo sem sair do lugar.", o:["A escada rolante","O carro","O skate","O patins"], r:0, e:"A escada rolante sobe e desce sempre no mesmo lugar!" },
  { c:"charadas", p:"O que é, o que é? Tem folhas mas não é árvore.", o:["O livro","O alface","O caderno","O jornal"], r:0, e:"As páginas do livro são chamadas de folhas!" },
  { c:"charadas", p:"O que é, o que é? Tem lâminas mas não corta roupa.", o:["O moinho","A tesoura","A faca","O serrote"], r:0, e:"As pás do moinho são como lâminas gigantes!" },
  { c:"charadas", p:"O que é, o que é? Corre pela casa toda mas não sai dela.", o:["A água da torneira","O gato","O rato","O vento"], r:0, e:"A água corre pelos canos dentro da casa!" },
  { c:"charadas", p:"O que é, o que é? Tem um olho só e não enxerga nada.", o:["A agulha","O ciclope","O farol","A lanterna"], r:0, e:"O furo da agulha é chamado de 'olho'!" },
  { c:"charadas", p:"O que é, o que é? Sempre sobe e nunca desce.", o:["A idade","A bola","O elevador","O avião"], r:0, e:"Nossa idade só aumenta com o tempo!" },
  { c:"charadas", p:"O que é, o que é? É branca quando suja.", o:["O quadro-negro (giz)","A neve","O leite","O algodão"], r:0, e:"O giz é branco e 'suja' o quadro negro!" },
  { c:"charadas", p:"O que é, o que é? Tem casca mas não é fruta; tem sementes mas não planta.", o:["O ovo","O coco","A laranja","O melão"], r:0, e:"O ovo tem casca e a gema é como uma 'semente'!" },
  { c:"charadas", p:"O que é, o que é? Vive na água e não se molha... porque é feito de gelo?", o:["O iceberg","O peixe","O barco","A baleia"], r:0, e:"O iceberg flutua no mar sendo um bloco de gelo!" },
  { c:"charadas", p:"O que é, o que é? Tem cidades mas não tem casas; tem montanhas mas não tem árvores; tem água mas não tem peixes.", o:["O mapa","O globo","O desenho","O livro"], r:0, e:"No mapa vemos cidades, montanhas e rios desenhados!" },
  { c:"charadas", p:"O que é, o que é? Quanto mais quente, mais fresco fica.", o:["O pão","O sorvete","O chá","A sopa"], r:0, e:"O pão sai quente do forno e fica fresquinho!" },
  { c:"charadas", p:"O que é, o que é? Anda com os pés na cabeça.", o:["O piolho","O morcego","O macaco","O pulga"], r:0, e:"O piolho anda de cabeça para baixo nos cabelos!" },
  { c:"charadas", p:"O que é, o que é? Quanto mais você me tira, mais eu cresço? Já sei: é o buraco! E o que cresce sem nunca diminuir?", o:["A sombra ao meio-dia","A bola","A pizza","A fila"], r:0, e:"Ao meio-dia, a sombra fica bem pequenina... mas de manhã ela cresce!" },
  { c:"charadas", p:"O que é, o que é? Tem raízes mas nunca bebe água.", o:["Os dentes","A árvore","A cenoura","A flor"], r:0, e:"Os dentes têm 'raízes' dentro da gengiva!" },
  { c:"charadas", p:"O que é, o que é? Dá muitas voltas e não sai do lugar.", o:["O ventilador","O carro","O pião","O relógio"], r:0, e:"As hélices do ventilador giram sem sair do lugar!" },
  { c:"charadas", p:"O que é, o que é? Fala todas as línguas do mundo.", o:["O eco","O tradutor","O papagaio","O rádio"], r:0, e:"O eco repete qualquer palavra que você disser!" },
  { c:"charadas", p:"O que é, o que é? Quem faz não quer, quem compra não usa, quem usa não vê.", o:["O caixão","O sapato","O chapéu","O remédio"], r:0, e:"É uma charada clássica: o caixão!" },
  { c:"charadas", p:"O que é, o que é? Tem banco mas não senta; tem juiz mas não joga futebol.", o:["O tribunal","O estádio","O parque","A escola"], r:0, e:"No tribunal há bancos e um juiz!" },
  { c:"charadas", p:"O que é, o que é? Tem asas mas não voa.", o:["O prédio","O pássaro","O avião","O morcego"], r:0, e:"Os prédios têm 'asas': as partes laterais!" },
  { c:"charadas", p:"O que é, o que é? É cheio de dentes e ajuda a arrumar o jardim.", o:["O ancinho","O tubarão","O pente","O trator"], r:0, e:"O ancinho tem 'dentes' que ajudam a juntar folhas!" },
  { c:"charadas", p:"O que é, o que é? Molha enquanto seca.", o:["A toalha","O secador","O sol","O ferro de passar"], r:0, e:"A toalha seca nosso corpo e fica molhada!" },
  { c:"charadas", p:"O que é, o que é? Tem coroa e não é rei; tem escamas e não é peixe.", o:["O abacaxi","A cobra","O galinho","A palmeira"], r:0, e:"O abacaxi tem 'coroa' e casca em escamas!" },
  { c:"charadas", p:"O que é, o que é? Anda pelo campo e come com os pés.", o:["O galo","O boi","O cavalo","O porco"], r:0, e:"O galo 'come' com os pés: ciscando o chão!" },
  { c:"charadas", p:"O que é, o que é? Quanto mais dele você tem, menos você vê.", o:["A escuridão","A luz","A névoa","A poeira"], r:0, e:"Quanto mais escuridão, menos conseguimos ver!" },
  { c:"charadas", p:"O que é, o que é? Entra na água e não se molha.", o:["A sombra","O pedaço de plástico","O barco","O peixe"], r:0, e:"A sombra entra na água e continua sequinha!" },
  { c:"charadas", p:"O que é, o que é? Tem cabeça vermelha e vive no fósforo.", o:["A chama","A formiga","O joaninha","O tomate"], r:0, e:"A cabeça do fósforo é vermelha e acende com atrito!" },
  { c:"charadas", p:"O que é, o que é? É alto quando jovem e baixo quando velho.", o:["A vela","A pessoa","A árvore","O prédio"], r:0, e:"A vela vai diminuindo conforme derrete!" },
  { c:"charadas", p:"O que é, o que é? Tem língua mas não fala.", o:["O sapato","O cachorro","O sino","O papagaio"], r:0, e:"A parte de dentro do sapato se chama 'língua'!" },
  { c:"charadas", p:"O que é, o que é? Quanto mais se afasta, menor parece.", o:["Tudo que está longe","Só o sol","Só a lua","Só o avião"], r:0, e:"Quanto mais longe um objeto está, menor ele parece!" },
  { c:"charadas", p:"O que é, o que é? Tem ponta mas não é flecha; escreve mas não é caneta.", o:["O lápis","A seta","O dedo","O prego"], r:0, e:"O lápis tem ponta e escreve muito bem!" },
  { c:"charadas", p:"O que é, o que é? Cai de pé e ninguém segura.", o:["A chuva","A bola","O papel","A folha"], r:0, e:"A gota de chuva cai 'de pé' do céu!" },
  { c:"charadas", p:"O que é, o que é? Se você me nomeia, eu deixo de existir.", o:["O silêncio","O vento","A sombra","O sonho"], r:0, e:"Quando você fala, o silêncio acaba!" },
  { c:"charadas", p:"O que é, o que é? Tem mil agulhas mas não costura.", o:["O cacto","O ouriço","O pinheiro","O porco-espinho"], r:0, e:"O cacto é coberto de espinhos como agulhas!" },
  { c:"charadas", p:"O que é, o que é? Sempre vem, mas nunca chega.", o:["O amanhã","O ônibus","O aniversário","O Natal"], r:0, e:"Quando o amanhã chega, virou hoje!" },
  { c:"charadas", p:"O que é, o que é? Pode ser dourado, mas não vale dinheiro.", o:["O pôr do sol","A moeda","O anel","O colar"], r:0, e:"O céu fica dourado no pôr do sol!" },
  { c:"charadas", p:"O que é, o que é? Tem pés e não caminha; tem cabeça e não pensa; tem braços e não escreve.", o:["A cama","O robô","O boneco","O manequim"], r:0, e:"A cama tem 'pés' e 'cabeceira', mas não anda nem pensa!" },
  { c:"charadas", p:"O que é, o que é? É seu, mas os outros usam mais que você.", o:["Seu nome","Seu sapato","Seu brinquedo","Seu cabelo"], r:0, e:"Nosso nome é chamado pelos outros o tempo todo!" },
  { c:"charadas", p:"O que é, o que é? Quanto mais você estuda, mais descobre que...", o:["Há mais para aprender","Nada resta","Está tudo errado","Não precisa escola"], r:0, e:"Quanto mais aprendemos, mais queremos saber!" },
  { c:"charadas", p:"O que é, o que é? Roda a vida inteira e nunca sai do canto.", o:["A roda do moinho","A roda do carro","O pião","A bicicleta"], r:0, e:"A roda do moinho gira presa no seu lugar!" },
  { c:"charadas", p:"O que é, o que é? Fica mais limpo quanto mais sujo trabalha.", o:["O sabão","A vassoura","O pano","O esponja"], r:0, e:"O sabão suja (se desfaz) limpando tudo!" },
  { c:"charadas", p:"O que é, o que é? Tem tronco mas não é árvore; viaja mas não anda.", o:["O trem","O caminhão","O ônibus","O navio"], r:0, e:"O trem viaja sobre os trilhos sem andar sozinho!" },
  { c:"charadas", p:"O que é, o que é? Quanto mais você me enche, mais leve eu fico.", o:["O balão de ar quente","O balde d'água","A mala","O saco de cimento"], r:0, e:"Quanto mais ar quente, mais alto o balão voa!" },

  { c:"animes", p:"Em 'Dragon Ball', como se chama o torneio de artes marciais?", o:["Tenkaichi Budokai","Chunin","Grand Line","Coliseu"], r:0, e:"O Tenkaichi Budokai reúne os melhores guerreiros!" },

  { c:"animes", p:"Em 'Demon Slayer', como se chama a irmã do Tanjiro?", o:["Nezuko","Kanao","Shinobu","Mitsuri"], r:0, e:"Nezuko se transformou em demônio, mas mantém o coração humano!" },
  { c:"animes", p:"Em 'Jujutsu Kaisen', quem é o professor do Yuji?", o:["Satoru Gojo","Nanami","Todo","Megumi"], r:0, e:"Gojo é o feiticeiro mais forte do mundo!" },
  { c:"animes", p:"Em 'Naruto', qual é o nome do cachorro do Kakashi?", o:["Pakkun","Tora","Bisuke","Akamaru"], r:0, e:"Pakkun é um cachorro ninja pequenino!" },
  { c:"animes", p:"Em 'One Piece', qual é o nome do bicho de estimação do Chopper?", o:["Nenhuma; ele é o bicho de estimação","Tony Tony Chopper","Rumble Ball","Cotton Candy"], r:0, e:"Chopper é a rena que comeu a Fruta Hitomi Hitomi!" },
  { c:"animes", p:"Em 'Dragon Ball Super', como se chama a forma mais poderosa do Goku?", o:["Ultra Instinto","Super Saiyajin Blue","Kaio-ken","Super Saiyajin 4"], r:0, e:"O Ultra Instinto transforma o Goku em um guerreiro divino!" },
  { c:"animes", p:"Em 'Attack on Titan', qual é o nome do Eren?", o:["Eren Yeager","Eren Jaeger","Eren Smith","Eren Ackerman"], r:0, e:"Eren Yeager é o herói que luta contra os Titãs!" },
  { c:"animes", p:"Em 'Demon Slayer', qual é o nome da Hashira da Água?", o:["Tomie Tokito","Shinobu Kocho","Mitsuri Kanroji","Muichiro Tokito"], r:0, e:"Tomie é o espadachim mais calmo e habilidoso!" }
];

/* ============ ESTADO DO JOGO ============ */
const TEMPO_LIMITE = 20;
let lista = [];          // perguntas da rodada
let indice = 0;
let pontos = 0;
let vidas = 3;
let nome = "";
let respondido = false;
let timerInterval = null;
let tempoRestante = TEMPO_LIMITE;
let categoriaAtual = null;
let categoriaChave = null;
let erros = [];
let treinoErros = [];
let jogadores = [];
let jogadorAtual = 0;
let numJogadores = 1;
let fimAguardando = false;

/* ============ CONFETES ============ */
const cv = document.getElementById("confete");
const ctx = cv.getContext("2d");
let particulas = [];
let raf = null;
const CORES = ["#f43f5e","#f59e0b","#10b981","#3b82f6","#8b5cf6","#ec4899","#facc15"];
function soltarConfete() {
  cv.width = innerWidth; cv.height = innerHeight;
  for (let i = 0; i < 180; i++) {
    particulas.push({
      x: Math.random() * cv.width,
      y: -20 - Math.random() * cv.height * 0.6,
      vx: (Math.random() - 0.5) * 5,
      vy: Math.random() * 3 + 2,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.2,
      tam: Math.random() * 10 + 6,
      cor: CORES[Math.floor(Math.random() * CORES.length)]
    });
  }
  if (!raf) raf = requestAnimationFrame(loopConfete);
}
function loopConfete() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  particulas = particulas.filter(p => p.y < cv.height + 30);
  particulas.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.cor;
    ctx.fillRect(-p.tam / 2, -p.tam / 2, p.tam, p.tam * 0.6);
    ctx.restore();
  });
  if (particulas.length > 0) raf = requestAnimationFrame(loopConfete);
  else { raf = null; ctx.clearRect(0, 0, cv.width, cv.height); }
}

/* ============ UTILITÁRIOS ============ */
function embaralhar(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function embaralharPergunta(q) {
  const pares = q.o.map((op, i) => ({ op, i }));
  const a = embaralhar(pares);
  return { ...q, o: a.map(x => x.op), r: a.findIndex(x => x.i === q.r) };
}
const $ = id => document.getElementById(id);
function mostrarTela(id) {
  document.querySelectorAll(".tela").forEach(t => t.classList.remove("ativa"));
  $(id).classList.add("ativa");
  window.scrollTo(0, 0);
}

/* ============ NAVEGAÇÃO ============ */
function renderInputs() {
  const box = $("inputs-nomes");
  box.innerHTML = "";
  for (let i = 0; i < numJogadores; i++) {
    const inp = document.createElement("input");
    inp.className = "input-nome";
    inp.type = "text";
    inp.maxLength = 12;
    inp.placeholder = "Nome do Jogador " + (i + 1) + "...";
    box.appendChild(inp);
  }
  $("num-jogadores").textContent = numJogadores;
}
$("btn-menos").addEventListener("click", () => {
  somClique();
  if (numJogadores > 1) { numJogadores--; renderInputs(); }
});
$("btn-mais").addEventListener("click", () => {
  somClique();
  if (numJogadores < 10) { numJogadores++; renderInputs(); }
});
$("btn-inicio").addEventListener("click", () => {
  somClique();
  const inputs = document.querySelectorAll("#inputs-nomes .input-nome");
  jogadores = [];
  inputs.forEach((inp, i) => {
    jogadores.push({ nome: inp.value.trim() || ("Jogador " + (i + 1)), pontos: 0, vidas: 3, acertos: 0, total: 0, erros: [] });
  });
  numJogadores = jogadores.length;
  jogadorAtual = 0;
  nome = jogadores[0].nome;
  if (jogadores.length === 1) {
    $("ola-nome").textContent = "Oi, " + nome + "! O que vamos aprender hoje? 😄";
  } else {
    $("ola-nome").textContent = "👥 Jogadores: " + jogadores.map(j => j.nome).join(", ") + "! Escolham o assunto!";
  }
  mostrarTela("tela-categorias");
});
$("btn-voltar-inicio").addEventListener("click", () => { somClique(); mostrarTela("tela-inicio"); });
$("btn-sair").addEventListener("click", () => {
  somClique();
  clearInterval(timerInterval);
  timerInterval = null;
  mostrarTela("tela-inicio");
});
$("btn-som").addEventListener("click", () => {
  somLigado = !somLigado;
  $("btn-som").textContent = somLigado ? "🔊" : "🔇";
  if (somLigado) somClique();
});

function montarCategorias() {
  const grade = $("grade-categorias");
  grade.innerHTML = "";
  Object.keys(CATEGORIAS).forEach(chave => {
    const cat = CATEGORIAS[chave];
    const btn = document.createElement("button");
    btn.className = "cat-btn";
    btn.style.background = "linear-gradient(135deg," + cat.cor + "," + sombrear(cat.cor) + ")";
    btn.innerHTML = "<span class='icone'>" + cat.icone + "</span>" + cat.nome;
    btn.addEventListener("click", () => { somClique(); iniciarJogo(chave); });
    grade.appendChild(btn);
  });
}
function sombrear(hex) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
  r = Math.max(0, r - 60); g = Math.max(0, g - 60); b = Math.max(0, b - 60);
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
$("btn-tudo").addEventListener("click", () => {
  somClique();
  categoriaChave = "misturado";
  reiniciarPontos();
  lista = montarListaRodada();
  comecarRodada("🎲 Tudo Misturado");
});

/* ============ JOGO ============ */
function montarListaRodada() {
  if (categoriaChave === "misturado") {
    return embaralhar(PERGUNTAS).slice(0, 10);
  }
  const base = PERGUNTAS.filter(q => q.c === categoriaChave);
  return embaralhar(base).map(embaralharPergunta);
}
function reiniciarPontos() {
  jogadores.forEach(j => { j.pontos = 0; j.vidas = 3; j.acertos = 0; j.total = 0; j.erros = []; });
  jogadorAtual = 0;
  carregarJogador();
}
function carregarJogador() {
  const pl = jogadores[jogadorAtual];
  nome = pl.nome;
  pontos = pl.pontos;
  vidas = pl.vidas;
  erros = pl.erros;
}
function salvarJogador() {
  const pl = jogadores[jogadorAtual];
  pl.pontos = pontos;
  pl.vidas = vidas;
  pl.erros = erros;
}
function iniciarJogo(chave) {
  categoriaChave = chave;
  reiniciarPontos();
  lista = montarListaRodada();
  comecarRodada(CATEGORIAS[chave].icone + " " + CATEGORIAS[chave].nome);
}
function comecarRodada(tag) {
  categoriaAtual = tag;
  indice = 0;
  jogadorAtual = 0;
  jogadores.forEach(j => { j.pontos = 0; j.vidas = 3; j.acertos = 0; j.total = 0; j.erros = []; });
  carregarJogador();
  atualizarHud();
  mostrarTela("tela-jogo");
  montarPergunta();
}
function atualizarHud() {
  $("jogador-badge").textContent = "🎮 " + nome;
  $("vidas").textContent = "❤️".repeat(Math.max(0, vidas)) + "🤍".repeat(Math.max(0, 3 - vidas));
  $("pontos").textContent = "⭐ " + pontos;
  $("progresso").style.width = (indice / lista.length * 100) + "%";
  atualizarPlacarVivo();
}
function atualizarPlacarVivo() {
  const box = $("placar-vivo");
  if (!box) return;
  if (jogadores.length <= 1) { box.innerHTML = ""; return; }
  box.innerHTML = jogadores.map((j, i) => {
    const ativo = (i === jogadorAtual) ? "background:#fff;color:#7c3aed;font-weight:800;transform:scale(1.06);" : "background:rgba(255,255,255,.35);color:#fff;";
    return "<span style='border-radius:999px;padding:4px 14px;font-size:.85rem;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:all .2s;" + ativo + "'>" + j.nome + ": " + j.pontos + "⭐</span>";
  }).join("");
}

function montarPergunta() {
  jogadorAtual = indice % jogadores.length;
  carregarJogador();
  const q = lista[indice];
  respondido = false;
  $("tag-categoria").textContent = categoriaAtual;
  $("turno-aviso").textContent = jogadores.length > 1 ? ("👆 É a vez de " + nome + "!") : "";
  $("pergunta").textContent = q.p;
  $("feedback").className = "feedback";
  $("feedback").innerHTML = "";
  $("acoes").classList.remove("ativa");
  $("btn-proxima").textContent = "➡️ Próxima";
  atualizarHud();

  const letras = ["A", "B", "C", "D"];
  const box = $("opcoes");
  box.innerHTML = "";
  q.o.forEach((op, i) => {
    const btn = document.createElement("button");
    btn.className = "opcao";
    btn.dataset.i = i;
    btn.innerHTML = "<span class='letra'>" + letras[i] + "</span><span>" + op + "</span>";
    btn.addEventListener("click", () => responder(i, btn));
    box.appendChild(btn);
  });

  iniciarCronometro();
}

function iniciarCronometro() {
  clearInterval(timerInterval);
  tempoRestante = TEMPO_LIMITE;
  const barra = $("cronometro");
  barra.classList.remove("perigo");
  $("tempo-numero").textContent = tempoRestante;
  barra.style.width = "100%";
  timerInterval = setInterval(() => {
    tempoRestante--;
    if (tempoRestante <= 0) {
      clearInterval(timerInterval);
      barra.style.width = "0%";
      somTempoFim();
      responder(-1, null);
      return;
    }
    $("tempo-numero").textContent = tempoRestante;
    barra.style.width = (tempoRestante / TEMPO_LIMITE * 100) + "%";
    if (tempoRestante <= 5) {
      barra.classList.add("perigo");
      somTick();
    }
  }, 1000);
}

function responder(indiceEscolhido, btnEscolhido) {
  if (respondido) return;
  respondido = true;
  clearInterval(timerInterval);

  const q = lista[indice];
  const botoes = document.querySelectorAll(".opcao");
  const letras = ["A", "B", "C", "D"];
  let acertou = indiceEscolhido === q.r;

  botoes.forEach((b, i) => {
    b.classList.add("apagada");
    if (i === q.r) b.classList.add("certa");
    if (i === indiceEscolhido && !acertou) b.classList.add("errada");
  });

  const fb = $("feedback");
  const pl = jogadores[jogadorAtual];
  pl.total++;
  if (acertou) {
    pontos += 10;
    pl.acertos++;
    fb.className = "feedback certo";
    fb.innerHTML = "🎉 Correto, " + nome + "! +10 pontos<br><span class='explicacao'>" + q.e + "</span>";
    somCerto();
  } else {
    vidas--;
    erros.push(q);
    fb.className = "feedback errado";
    const texto = indiceEscolhido === -1
      ? "⏰ Tempo esgotado! A resposta certa é a letra " + letras[q.r] + "."
      : "😢 Quase! A resposta certa é a letra " + letras[q.r] + ".";
    fb.innerHTML = texto + "<br><span class='explicacao'>" + q.e + "</span>";
    somErrado();
  }
  salvarJogador();

  $("pontos").textContent = "⭐ " + pontos;
  $("vidas").textContent = "❤️".repeat(Math.max(0, vidas)) + "🤍".repeat(Math.max(0, 3 - vidas));
  $("acoes").classList.add("ativa");
  atualizarPlacarVivo();

  indice++;

  fimAguardando = indice >= lista.length || (jogadores.length === 1 && vidas <= 0);
  $("btn-proxima").textContent = fimAguardando ? "🏁 Ver resultado" : "➡️ Próxima";
}

$("btn-proxima").addEventListener("click", () => {
  somClique();
  if (fimAguardando) {
    if (jogadores.length > 1) mostrarRanking();
    else mostrarFim();
    return;
  }
  montarPergunta();
});

/* ============ FIM ============ */
function mostrarFim() {
  clearInterval(timerInterval);
  const total = lista.length;
  const acertos = Math.max(0, Math.round(pontos / 10));
  const pct = acertos / total;

  let estrelas, emoji, msg;
  if (vidas <= 0) {
    estrelas = "😢"; emoji = "💪";
    msg = "As vidas acabaram, mas você é um campeão por tentar!";
  } else if (pct >= 0.9) { estrelas = "⭐⭐⭐"; emoji = "🏆"; msg = "Você é um gênio, " + nome + "! Incrível!"; }
  else if (pct >= 0.6) { estrelas = "⭐⭐"; emoji = "🎉"; msg = "Muito bem, " + nome + "! Continue assim!"; }
  else if (pct >= 0.3) { estrelas = "⭐"; emoji = "🙂"; msg = "Bom começo, " + nome + "! Vamos treinar mais?"; }
  else { estrelas = "💪"; emoji = "🌱"; msg = "Não desista, " + nome + "! Cada erro ensina!"; }

  $("emoji-fim").textContent = emoji;
  $("estrelas").textContent = estrelas;
  $("mensagem-final").textContent = msg;
  $("placar-final").textContent = "Você acertou " + acertos + " de " + total + " perguntas e fez " + pontos + " pontos!";
  $("titulo-fim").textContent = nome + ", você chegou ao fim! 🎊";

  const rev = $("revisao");
  const btnTreinar = $("btn-treinar-erros");
  const letras = ["A", "B", "C", "D"];
  if (erros.length === 0) {
    rev.innerHTML = "<p style='margin-top:8px;font-weight:700;color:#10b981;text-align:center;'>🏅 Perfeito! Você acertou tudo — conhecimento mandou bem!</p>";
    btnTreinar.style.display = "none";
  } else {
    let html = "<h3 style='font-size:1.1rem;color:#7c3aed;margin-bottom:4px;'>📚 Aprenda com os erros:</h3>";
    erros.forEach((q, k) => {
      html += "<div style='background:#f8fafc;border:2px solid #fee2e2;border-radius:14px;padding:10px 14px;margin-top:10px;'>"
        + "<div style='font-weight:800;color:#334155;'>" + (k + 1) + ". " + q.p + "</div>"
        + "<div style='color:#059669;font-weight:700;margin-top:4px;'>✅ " + letras[q.r] + ") " + q.o[q.r] + "</div>"
        + "<div style='color:#64748b;font-size:.9rem;margin-top:4px;'>" + q.e + "</div></div>";
    });
    rev.innerHTML = html;
    btnTreinar.style.display = "inline-block";
  }

  mostrarTela("tela-fim");
  soltarConfete();
  if (pct >= 0.6 && vidas > 0) somVitoria();
  else if (vidas <= 0) somGameOver();
}

function mostrarRanking() {
  const ordem = jogadores.slice().sort((a, b) => b.pontos - a.pontos);
  const medalhas = ["🥇", "🥈", "🥉", "🏅", "🎖️", "🎖️", "🎖️", "🎖️", "🎖️", "🎖️"];
  $("emoji-fim").textContent = "🏆";
  $("titulo-fim").textContent = "Ranking Final!";
  $("estrelas").textContent = ordem.map((_, i) => medalhas[i] || "🏅").join(" ");
  $("mensagem-final").textContent = "Campeão: " + ordem[0].nome + " com " + ordem[0].pontos + " pontos! 🎉";
  let placar = "";
  ordem.forEach((j, i) => {
    placar += (medalhas[i] || "🏅") + " <b>" + j.nome + "</b> — " + j.pontos + " pontos (" + j.acertos + " de " + j.total + " acertos)<br>";
  });
  $("placar-final").innerHTML = placar;
  $("revisao").innerHTML = "";
  $("btn-treinar-erros").style.display = "none";
  mostrarTela("tela-fim");
  soltarConfete();
  somVitoria();
}

$("btn-treinar-erros").addEventListener("click", () => {
  somClique();
  if (erros.length === 0) return;
  treinoErros = erros.slice();
  lista = embaralhar(treinoErros).map(embaralharPergunta);
  comecarRodada("🎯 Treinando as erradas");
});
$("btn-jogar-novamente").addEventListener("click", () => {
  somClique();
  if (categoriaAtual === "🎯 Treinando as erradas" && treinoErros.length) {
    lista = embaralhar(treinoErros).map(embaralharPergunta);
    comecarRodada("🎯 Treinando as erradas");
    return;
  }
  reiniciarPontos();
  lista = montarListaRodada();
  comecarRodada(categoriaAtual);
});
$("btn-outra-categoria").addEventListener("click", () => { somClique(); reiniciarPontos(); mostrarTela("tela-categorias"); });
$("btn-inicio-novo").addEventListener("click", () => { somClique(); mostrarTela("tela-inicio"); });

/* ============ TECLADO ============ */
document.addEventListener("keydown", (e) => {
  const telaJogoAtiva = $("tela-jogo").classList.contains("ativa");
  if (!telaJogoAtiva) return;
  const tecla = e.key.toUpperCase();
  const letras = ["A", "B", "C", "D"];
  if (letras.includes(tecla) && !respondido) {
    const idx = letras.indexOf(tecla);
    const btn = document.querySelectorAll(".opcao")[idx];
    if (btn) responder(idx, btn);
  } else if (e.key === "Enter" && respondido) {
    $("btn-proxima").click();
  }
});

/* ============ INÍCIO ============ */
montarCategorias();
renderInputs();
</script>
